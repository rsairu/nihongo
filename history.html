<!DOCTYPE html>
<html lang="ja" class="history-html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>履歴</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="vocab_clicker.css" />
  <link rel="stylesheet" href="lookup.css" />
  <link rel="stylesheet" href="history.css" />
</head>
<body class="history-body">
  <header class="topbar">
    <h1>履歴</h1>
    <span id="historyTotal" class="history-total" aria-live="polite"></span>
    <nav class="page-links">
      <a class="page-link" href="lookup.html">← リトリーブ</a>
    </nav>
  </header>

  <main class="history-page">
    <!-- 調べ方で絞り込む。並びはリトリーブのモードの列と同じ。もう一度押すか「すべて」で解除 -->
    <div id="historyFilter" class="history-filter" role="group" aria-label="調べ方で絞り込む">
      <button class="history-filter-all active" type="button" aria-pressed="true" data-mode="">すべて</button>
      <button class="history-filter-btn" type="button" aria-pressed="false" title="辞書" aria-label="辞書" data-mode="dict"><img class="mode-icon" src="icons_png/web/lookup.png" alt="" width="48" height="48" /></button>
      <button class="history-filter-btn" type="button" aria-pressed="false" title="例文" aria-label="例文" data-mode="sentence"><img class="mode-icon" src="icons_png/web/sentence.png" alt="" width="48" height="48" /></button>
      <button class="history-filter-btn" type="button" aria-pressed="false" title="漢字辞典" aria-label="漢字辞典" data-mode="jiten"><img class="mode-icon" src="icons_png/web/jiten.png" alt="" width="48" height="48" /></button>
      <button class="history-filter-btn" type="button" aria-pressed="false" title="類義語" aria-label="類義語" data-mode="thes"><img class="mode-icon" src="icons_png/web/thesaurus.png" alt="" width="48" height="48" /></button>
      <button class="history-filter-btn" type="button" aria-pressed="false" title="使い分け" aria-label="使い分け" data-mode="cmp"><img class="mode-icon" src="icons_png/web/compare.png" alt="" width="48" height="48" /></button>
      <button class="history-filter-btn" type="button" aria-pressed="false" title="漢字表記" aria-label="漢字表記" data-mode="kanji"><img class="mode-icon" src="icons_png/web/kana.png" alt="" width="48" height="48" /></button>
      <button class="history-filter-btn" type="button" aria-pressed="false" title="ふりがな" aria-label="ふりがな" data-mode="furi"><img class="mode-icon" src="icons_png/web/furigana.png" alt="" width="48" height="48" /></button>
    </div>
    <p id="historyNote" class="history-note" hidden>このブラウザに保存された履歴です（ローカルで開いているため）。</p>
    <ol id="historyList" class="history-list" aria-label="調べた語（新しい順）"></ol>
    <div class="history-foot">
      <p id="historyStatus" class="history-status" role="status"></p>
      <button id="historyMoreBtn" class="secondary history-more" type="button" hidden>さらに50件</button>
    </div>
  </main>

  <script src="store.js"></script>
  <script src="history.js"></script>
</body>
</html>
